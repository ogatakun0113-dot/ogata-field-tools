<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1d20">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>総合換算ツール電卓 V1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one handheld calculator body (front = calculator, back = 詳細設定) centered in the viewport; flips on its Y axis. Single dark look by design. */
:root{
  color-scheme:dark;
  --room:#0c0d0f;
  --case:#1b1d20;
  --case-hi:#26292d;
  --lcd:#a7bd9f;
  --lcd-ink:#1d2a1b;
  --lcd-dim:#566b50;
  --lcd-inv:#2a3a27;
  --key-light:#c8cace;
  --key-light-hi:#e3e5e8;
  --key-light-ink:#15171a;
  --key-dark:#303337;
  --key-dark-hi:#43474c;
  --key-dark-ink:#f3f4f5;
  --alt:#e7b84a;
  --alt-ink:#1a1408;
  --shift:#2e8a76;
  --shift-ink:#eafaf6;
  --clr:#e2463d;
  --clr-ink:#fff4f2;
  --label:#e9a83a;
  --sub:#35b49b;
  --fg:#e8eaec;
  --muted:#8d949b;
  --line:#33373c;
  --ok:#5fd18d;
  --warn:#ff8a65;
  --f-ui:"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
  --f-lcd:"DejaVu Sans Mono","Consolas","Roboto Mono","Menlo",ui-monospace,monospace;
  --f-key:"Arial Rounded MT Bold","Helvetica Neue","Arial",var(--f-ui);
}
html,body{height:100%;height:100dvh}
body{background:var(--room);color:var(--fg);font-family:var(--f-ui);margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
.stage{height:100%;display:flex;justify-content:center}
.flipper{position:relative;width:100%;max-width:460px;height:100%}
.flipper.turn-out{animation:turnOut .2s ease-in forwards}
.flipper.turn-in{animation:turnIn .22s ease-out}
@keyframes turnOut{to{transform:scaleX(0)}}
@keyframes turnIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.flipper.turn-out,.flipper.turn-in{animation:none}}
.face{position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(180deg,var(--case-hi),var(--case) 18%);box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.55);overflow:hidden}
.front{display:flex;flex-direction:column;padding:8px 6px 8px}
.back{display:flex;flex-direction:column}

/* ---- status strip ---- */
.status{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 8px 6px;font:600 clamp(11px,1.7vh,14px)/1 var(--f-ui);color:#fff;letter-spacing:.02em}
.status button{all:unset;cursor:pointer;padding:3px 4px;border-radius:4px;white-space:nowrap}
.status button:focus-visible{outline:2px solid var(--sub)}
.brand{font:700 10px/1 var(--f-ui);color:var(--muted);letter-spacing:.12em}

/* ---- LCD ---- */
.lcd{flex:1 1 0;min-height:110px;background:var(--lcd);color:var(--lcd-ink);border-radius:12px;margin:0 2px 8px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;font-family:var(--f-lcd)}
.lcd-top{display:flex;gap:8px;align-items:center;padding:6px 10px 2px;font:700 11px/1.2 var(--f-ui);color:var(--lcd-dim);letter-spacing:.06em}
.lcd-top .ind{padding:0 4px;border-radius:3px}
.lcd-top .ind.on{background:var(--lcd-inv);color:var(--lcd)}
.lcd-top .grow{flex:1}
.lcd-x{all:unset;cursor:pointer;font:700 12px/1 var(--f-ui);color:var(--lcd-ink);padding:2px 6px;border:1px solid var(--lcd-dim);border-radius:4px}
.lcd-body{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:2px 10px 8px;display:flex;flex-direction:column}
.entry{font-size:clamp(18px,3vh,24px);line-height:1.3;word-break:break-all;min-height:1.3em}
.cursor{display:inline-block;width:2px;height:1.05em;background:#2257c9;vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
.result{margin-top:auto;text-align:right;font-size:clamp(30px,6vh,46px);line-height:1.15;font-weight:500;word-break:break-all;font-variant-numeric:tabular-nums}
.result.preview{color:var(--lcd-dim);font-size:clamp(20px,3.6vh,28px)}
.hint{font:500 12px/1.6 var(--f-ui);color:var(--lcd-dim);margin-top:6px}
.hint b{color:var(--lcd-ink)}
.rows{display:flex;flex-direction:column;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 4px;border-bottom:1px dashed rgba(29,42,27,.25);font-variant-numeric:tabular-nums;cursor:pointer;border-radius:3px}
.row .l{font:600 12px/1.3 var(--f-ui);white-space:nowrap}
.row .v{font-size:clamp(15px,2.4vh,19px);text-align:right;word-break:break-all}
.row.me{background:var(--lcd-inv);color:var(--lcd)}
.row.strong .v{font-weight:700;font-size:clamp(18px,3vh,24px)}
.row.static{cursor:default}
.convin{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.convin .u{font:700 14px/1 var(--f-ui)}
.note{font:500 11px/1.5 var(--f-ui);color:var(--lcd-dim);margin-top:6px}
.warn{font:700 12px/1.4 var(--f-ui);color:#8a1c0f;margin-top:4px}
.fld{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:3px 4px;border-radius:3px;cursor:pointer}
.fld .l{font:600 12px/1.3 var(--f-ui);white-space:nowrap}
.fld .v{font-size:clamp(15px,2.4vh,19px);text-align:right;word-break:break-all}
.fld.act{background:var(--lcd-inv);color:var(--lcd)}
.fld .opt::before{content:"◀ ";opacity:.55;font-size:.7em}
.fld .opt::after{content:" ▶";opacity:.55;font-size:.7em}
.sw{display:inline-block;width:.8em;height:.8em;border:1px solid rgba(0,0,0,.5);margin-right:4px;vertical-align:-1px}
.sep{border-top:2px solid rgba(29,42,27,.45);margin:6px 0 2px}
.ttl{font:700 14px/1.3 var(--f-ui);margin:2px 0 4px}
.list .row .l{font-size:14px}
.list .row .v{font:600 12px/1.3 var(--f-ui)}

/* ---- keys ---- */
.keys{display:grid;grid-template-columns:repeat(5,1fr);column-gap:6px;row-gap:0;padding:0 2px}
.kc{display:flex;flex-direction:column;min-width:0}
.kl{height:clamp(13px,2vh,17px);font:700 clamp(10px,1.55vh,13px)/1 var(--f-key);color:var(--label);text-align:center;white-space:nowrap;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.kl.none{height:5px}
.k{position:relative;display:flex;align-items:center;justify-content:center;border:0;border-radius:6px;cursor:pointer;font-family:var(--f-key);
  height:clamp(30px,4.6vh,44px);font-size:clamp(14px,2.4vh,20px);font-weight:700;padding:0 2px;white-space:nowrap;touch-action:manipulation;
  box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.k:active,.k.down{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1);filter:brightness(.92)}
.k:focus-visible{outline:2px solid var(--sub);outline-offset:1px}
.k.lt{background:linear-gradient(180deg,var(--key-light-hi),var(--key-light));color:var(--key-light-ink)}
.k.dk{background:linear-gradient(180deg,var(--key-dark-hi),var(--key-dark));color:var(--key-dark-ink);height:clamp(38px,6.2vh,58px);font-size:clamp(22px,3.9vh,34px);font-weight:400;font-family:"Helvetica Neue",Arial,var(--f-ui)}
.k.dk.op{font-size:clamp(20px,3.6vh,30px)}
.k.dk.sm{font-size:clamp(16px,2.8vh,24px)}
.k.alt{background:var(--alt);color:var(--alt-ink)}
.k.sh{background:var(--shift);color:var(--shift-ink)}
.k.sh.on{box-shadow:0 0 0 2px #fff inset,0 2px 0 rgba(0,0,0,.55)}
.k.cl{background:var(--clr);color:var(--clr-ink)}
.k.jp{font-size:clamp(12px,2vh,16px)}
.k .tr{position:absolute;top:3px;right:6px;font:400 clamp(10px,1.7vh,15px)/1 var(--f-key);color:var(--label)}
.k .br{position:absolute;bottom:3px;right:7px;font:400 clamp(10px,1.7vh,15px)/1 var(--f-key);color:var(--sub)}
.grpgap{grid-column:1/-1;height:4px}
.dkrow{margin-top:6px}

/* ---- back side ---- */
.bk-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.bk-head h2{margin:0;font:700 17px/1.2 var(--f-ui);letter-spacing:.04em}
.bk-head small{display:block;color:var(--muted);font:500 11px/1.4 var(--f-ui);letter-spacing:.1em}
.btn{all:unset;cursor:pointer;padding:9px 14px;border-radius:8px;font:700 13px/1 var(--f-ui);background:var(--alt);color:var(--alt-ink);text-align:center}
.btn.ghost{background:var(--key-dark);color:var(--fg)}
.btn.danger{background:var(--clr);color:var(--clr-ink)}
.btn:focus-visible{outline:2px solid var(--sub)}
.bk-body{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 16px 20px;user-select:text;-webkit-user-select:text}
.sec{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font:700 12px/1.2 var(--f-ui);color:var(--label);letter-spacing:.12em}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fr>label,.fr>span{font:500 13px/1.4 var(--f-ui);color:var(--fg)}
.seg{display:flex;background:var(--key-dark);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font:600 12px/1 var(--f-ui);color:var(--muted)}
.seg button.on{background:var(--key-light);color:var(--key-light-ink)}
.seg button:focus-visible{outline:2px solid var(--sub)}
.num{width:84px;padding:7px 8px;border-radius:7px;border:1px solid var(--line);background:#111315;color:var(--fg);font:500 14px/1 var(--f-lcd);text-align:right}
.num:disabled{opacity:.45}
.num:focus{outline:2px solid var(--sub);outline-offset:0}
.grid3{display:grid;grid-template-columns:minmax(0,1.5fr) 1fr 1fr;gap:6px 8px;align-items:center;font:500 12px/1.3 var(--f-ui)}
.grid3 .h{color:var(--muted);font-size:11px}
.grid3 .num{width:100%}
.tg{all:unset;cursor:pointer;width:46px;height:26px;border-radius:13px;background:var(--key-dark);position:relative}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.tg.on{background:var(--shift)}
.tg.on::after{left:23px;background:#fff}
.tg:focus-visible{outline:2px solid var(--sub)}
.help{font:400 12px/1.7 var(--f-ui);color:var(--muted)}
.help b{color:var(--fg)}
.plate{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:8px;font:500 11px/1.6 var(--f-ui);color:var(--muted);text-align:center;letter-spacing:.06em}
.swt{font-size:clamp(40px,8.5vh,64px);text-align:center;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:6px 0 2px;line-height:1.1}
.swst{text-align:center;font:700 12px/1.4 var(--f-ui);color:var(--lcd-dim);letter-spacing:.1em}
.swb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.swb button{all:unset;cursor:pointer;text-align:center;padding:14px 0;border-radius:10px;font:700 17px/1 var(--f-ui);background:var(--lcd-inv);color:var(--lcd);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.swb button.go{background:#24622f;color:#eaf7ea}
.swb button.stop{background:#8a2a1f;color:#fff1ee}
.swb button:active{transform:translateY(2px);box-shadow:none}
.swb button:focus-visible{outline:2px solid var(--lcd-ink)}
.confirm{font:600 12px/1.4 var(--f-ui);color:var(--warn)}
</style>
</head>
<body>

<div class="stage">
 <div class="flipper" id="flipper">

   <div class="keys" id="keys"><div class="kc"><div class="kl">⏱計時</div><button type="button" class="k alt" data-k="tool" id="key-0-tool" aria-label="TOOL / SHIFT: ⏱計時">TOOL</button></div><div class="kc"><div class="kl"></div><button type="button" class="k sh" data-k="shift" id="key-0-shift" aria-label="SHIFT">SHIFT</button></div><div class="kc"><div class="kl"></div><button type="button" class="k lt jp" data-k="set" id="key-0-set" aria-label="⚙ 設定">⚙ 設定</button></div><div class="kc"><div class="kl"></div><button type="button" class="k lt" data-k="bs" id="key-0-bs" aria-label="⌫ BS">⌫ BS</button></div><div class="kc"><div class="kl">AC</div><button type="button" class="k cl" data-k="clr" id="key-0-clr" aria-label="CLR / SHIFT: AC">CLR</button></div><div class="kc"><div class="kl none"></div><button type="button" class="k lt" data-k="pm" id="key-1-pm" aria-label="(−)">(−)</button></div><div class="kc"><div class="kl none"></div><button type="button" class="k lt" data-k="up" id="key-1-up" aria-label="▲">▲</button></div><div class="kc"><div class="kl none"></div><button type="button" class="k lt" data-k="down" id="key-1-down" aria-label="▼">▼</button></div><div class="kc"><div class="kl none"></div><button type="button" class="k lt" data-k="left" id="key-1-left" aria-label="◀">◀</button></div><div class="kc"><div class="kl none"></div><button type="button" class="k lt" data-k="right" id="key-1-right" aria-label="▶">▶</button></div><div class="kc"><div class="kl">50/75Ω</div><button type="button" class="k lt" data-k="dBm" id="key-2-dBm" aria-label="dBm / SHIFT: 50/75Ω">dBm</button></div><div class="kc"><div class="kl"></div><button type="button" class="k lt" data-k="dBuV" id="key-2-dBuV" aria-label="dBμV">dBμV</button></div><div class="kc"><div class="kl"></div><button type="button" class="k lt" data-k="W" id="key-2-W" aria-label="W">W</button></div><div class="kc"><div class="kl"></div><button type="button" class="k lt" data-k="mW" id="key-2-mW" aria-label="mW">mW</button></div><div class="kc"><div class="kl">波長</div><button type="button" class="k lt jp" data-k="vswr" id="key-2-vswr" aria-label="VSWR / SHIFT: 波長">VSWR</button></div><div class="kc"><div class="kl">種別切替</div><button type="button" class="k lt jp" data-k="TX" id="key-3-TX" aria-label="伝送値 / SHIFT: 種別切替">伝送値</button></div><div class="kc"><div class="kl"></div><button type="button" class="k lt jp" data-k="IND" id="key-3-IND" aria-label="指示値">指示値</button></div><div class="kc"><div class="kl"></div><button type="button" class="k lt jp" data-k="PCT" id="key-3-PCT" aria-label="割合%">割合%</button></div><div class="kc"><div class="kl"></div><button type="button" class="k lt jp" data-k="MA" id="key-3-MA" aria-label="電流mA">電流mA</button></div><div class="kc"><div class="kl"></div><button type="button" class="k lt jp" data-k="V" id="key-3-V" aria-label="電圧V">電圧V</button></div><div class="kc"><div class="kl">xʸ</div><button type="button" class="k lt" data-k="sq" id="key-4-sq" aria-label="x² / SHIFT: xʸ">x²</button></div><div class="kc"><div class="kl">∛</div><button type="button" class="k lt" data-k="sqrt" id="key-4-sqrt" aria-label="√ / SHIFT: ∛">√</button></div><div class="kc"><div class="kl">ln</div><button type="button" class="k lt" data-k="log" id="key-4-log" aria-label="log / SHIFT: ln">log</button></div><div class="kc"><div class="kl">eˣ</div><button type="button" class="k lt" data-k="pow10" id="key-4-pow10" aria-label="10ˣ / SHIFT: eˣ">10ˣ</button></div><div class="kc"><div class="kl">π</div><button type="button" class="k lt" data-k="inv" id="key-4-inv" aria-label="x⁻¹ / SHIFT: π">x⁻¹</button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="7" id="key-5-7" aria-label="7">7</button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="8" id="key-5-8" aria-label="8">8</button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="9" id="key-5-9" aria-label="9">9</button></div><div class="kc dkrow"><button type="button" class="k dk op" data-k="(" id="key-5-_" aria-label="(">(</button></div><div class="kc dkrow"><button type="button" class="k dk op" data-k=")" id="key-5-_" aria-label=")">)</button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="4" id="key-6-4" aria-label="4">4<span class="br">D</span></button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="5" id="key-6-5" aria-label="5">5<span class="br">E</span></button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="6" id="key-6-6" aria-label="6">6<span class="br">F</span></button></div><div class="kc dkrow"><button type="button" class="k dk op" data-k="×" id="key-6-_" aria-label="×">×</button></div><div class="kc dkrow"><button type="button" class="k dk op" data-k="÷" id="key-6-_" aria-label="÷">÷</button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="1" id="key-7-1" aria-label="1">1<span class="br">A</span></button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="2" id="key-7-2" aria-label="2">2<span class="br">B</span></button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="3" id="key-7-3" aria-label="3">3<span class="br">C</span></button></div><div class="kc dkrow"><button type="button" class="k dk op" data-k="+" id="key-7-_" aria-label="+">+</button></div><div class="kc dkrow"><button type="button" class="k dk op" data-k="−" id="key-7-_" aria-label="−">−</button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="0" id="key-8-0" aria-label="0">0</button></div><div class="kc dkrow"><button type="button" class="k dk" data-k="." id="key-8-_" aria-label="・">・</button></div><div class="kc dkrow"><button type="button" class="k dk sm" data-k="exp" id="key-8-exp" aria-label="Exp">Exp</button></div><div class="kc dkrow"><button type="button" class="k dk sm" data-k="ans" id="key-8-ans" aria-label="Ans">Ans</button></div><div class="kc dkrow"><button type="button" class="k dk op" data-k="=" id="key-8-_" aria-label="=">=</button></div></div>
  </section>

  <!-- ===== BACK (詳細設定) ===== -->
  <section class="face back" id="back" aria-label="詳細設定" hidden>
   <div class="bk-head">
    <div><h2>詳細設定</h2><small>BACK PANEL ・ 自動保存</small></div>

<script>
(function(){
'use strict';
/* ================= 定数 ================= */
var LS_KEY='sogoKansanCalcV1';
var DEF_SET={imp:50,tx:'dec',scale:{dec:[0,5],hex1:[0,10],hex2:[0,10]},ma:[4,20],vmode:'15',r:250,digits:'auto',vib:true,restore:true};
var TXT={

/* ================= 数式パーサ ================= */
var FUNCS=['log(','ln(','√(','∛(','Ans','π','ℯ'];
function tokenize(s){
  var t=[],i=0;
  while(i<s.length){
    var c=s[i];
    if(/[0-9.]/.test(c)){
      var m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)(ᴇ[-−]?\d+)?/);
      if(!m) throw 'syn';
      t.push({n:parseFloat(m[0].replace('ᴇ','e').replace('−','-'))}); i+=m[0].length; continue;
    }
    var hit=null;
    for(var j=0;j<FUNCS.length;j++){ if(s.substr(i,FUNCS[j].length)===FUNCS[j]){hit=FUNCS[j];break;} }
    if(hit){t.push({f:hit});i+=hit.length;continue;}
    if(s.substr(i,2)==='⁻¹'){t.push({o:'⁻¹'});i+=2;continue;}
    if('+−×÷^()-²'.indexOf(c)>=0){t.push({o:c});i++;continue;}
    throw 'syn';
  }
  return t;
}
function evalExpr(s,ans){
  if(s==null) return NaN;
  s=String(s).trim(); if(!s) return NaN;
  var t; try{t=tokenize(s);}catch(e){return NaN;}
  var p=0;
  function pk(){return t[p];}
  function isO(x,o){return x&&x.o===o;}
  function startsPrimary(x){return x&&(x.n!==undefined||x.f||isO(x,'('));}
  function expr(){var v=term();while(pk()&&(isO(pk(),'+')||isO(pk(),'−'))){var o=t[p++].o;var r=term();v=o==='+'?v+r:v-r;}return v;}
  function term(){var v=unary();for(;;){var x=pk();if(isO(x,'×')){p++;v*=unary();}else if(isO(x,'÷')){p++;v/=unary();}else if(startsPrimary(x)){v*=unary();}else break;}return v;}
  function unary(){var x=pk();if(isO(x,'-')||isO(x,'−')){p++;return -unary();}if(isO(x,'+')){p++;return unary();}return power();}
  function power(){var b=postfix();if(isO(pk(),'^')){p++;var e=unary();return Math.pow(b,e);}return b;}
  function postfix(){var v=primary();for(;;){var x=pk();if(isO(x,'²')){p++;v=v*v;}else if(isO(x,'⁻¹')){p++;v=1/v;}else break;}return v;}
  function group(){var v=expr();if(isO(pk(),')'))p++;return v;}
  function primary(){
    var x=t[p++]; if(!x) throw 'syn';
    if(x.n!==undefined) return x.n;
    if(x.f==='π') return Math.PI;
    if(x.f==='ℯ') return Math.E;
    if(x.f==='Ans') return ans!==undefined?ans:S.ans;
    if(isO(x,'(')) return group();
    if(x.f==='log(') return Math.log10(group());
    if(x.f==='ln(') return Math.log(group());
    if(x.f==='√(') return Math.sqrt(group());
    if(x.f==='∛(') return Math.cbrt(group());
    throw 'syn';
  }
  try{var v=expr(); if(p<t.length) return NaN; return v;}catch(e){return NaN;}
}

/* ================= 書式 ================= */
function fx(x,d){ if(x===null||x===undefined||!isFinite(x)) return '--'; return Number(x).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtNum(v){
  if(isNaN(v)) return 'Syntax ERROR';
  if(!isFinite(v)) return 'Math ERROR';
  var d=S.set.digits;
  if(d!=='auto') return v.toFixed(+d);
  var a=Math.abs(v);
  if(a!==0&&(a>=1e10||a<1e-6)){var e=v.toExponential(8).split('e');return String(Number(e[0]))+'×10^'+Number(e[1]);}
  return String(Number(v.toPrecision(12)));
}
function rawNum(v){ if(!isFinite(v)) return ''; var a=Math.abs(v); if(a!==0&&(a>=1e10||a<1e-6)){var e=v.toExponential(8).split('e');return String(Number(e[0]))+'ᴇ'+Number(e[1]);} return String(Number(v.toPrecision(10))); }
var SIP=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'μ'],[1e-9,'n'],[1e-12,'p'],[1e-15,'f']];
function si(v,u){
  if(!isFinite(v)) return '--';
  if(v===0) return '0 '+u;
  var a=Math.abs(v);
  for(var i=0;i<SIP.length;i++){ if(a>=SIP[i][0]*0.99995||i===SIP.length-1){ return (v/SIP[i][0]).toPrecision(5)+' '+SIP[i][1]+u; } }
}
function plainU(v,u){
  if(!isFinite(v)) return '--';
  if(v===0) return '0 '+u;
  var a=Math.abs(v);
  if(a>=1e-4&&a<1e7) return String(Number(v.toPrecision(6)))+' '+u;
  var e=v.toExponential(4).split('e'); return String(Number(e[0]))+'×10^'+Number(e[1])+' '+u;
}
function pieces(str){ var out=[],i=0; while(i<str.length){ if(str.substr(i,2)==='⁻¹'){out.push('⁻¹');i+=2;} else {out.push(str[i]);i++;} } return out; }

function off(){return 120+10*Math.log10(S.set.imp/1000);}
function rfCalc(unit,x){
  var o=off(),dbm=NaN;
  if(unit==='dBm') dbm=x; else if(unit==='dBuV') dbm=x-o;
  else if(unit==='W') dbm=x>0?10*Math.log10(x*1000):NaN;
  else if(unit==='mW') dbm=x>0?10*Math.log10(x):NaN;
  var mw=Math.pow(10,dbm/10), w=mw/1000, v=Math.sqrt(w*S.set.imp);
  return {rows:[
    {l:'電力 dBm',v:fx(dbm,2)+' dBm',u:'dBm',raw:dbm},
    {l:'電圧 dBμV',v:fx(dbm+o,2)+' dBμV',u:'dBuV',raw:dbm+o},
    {l:'電力 W',v:plainU(w,'W'),u:'W',raw:w},
    {l:'電力 mW',v:unit==='mW'?plainU(mw,'mW'):si(w,'W'),u:'mW',raw:mw},
    {l:'端子電圧 ('+S.set.imp+'Ω)',v:si(v,'V'),u:null}
  ],note:S.set.imp+'Ω系 : 0 dBm = 1 mW = '+o.toFixed(2)+' dBμV'};
}
function txCfg(){
  var t=TXT[S.set.tx], sc=S.set.scale[S.set.tx], ma=S.set.ma;
  var r=S.set.vmode==='15'?250:(+S.set.r||250);
  return {t:t,smin:+sc[0],smax:+sc[1],amin:+ma[0],amax:+ma[1],r:r,vmin:ma[0]/1000*r,vmax:ma[1]/1000*r};
}
function txCalc(unit,x){
  var c=txCfg(),p=NaN;
  if(unit==='TX') p=(x-c.t.min)/c.t.div;
  else if(unit==='IND') p=(c.smax-c.smin)!==0?(x-c.smin)/(c.smax-c.smin):0;
  else if(unit==='PCT') p=x/100;
  else if(unit==='MA') p=(c.amax-c.amin)!==0?(x-c.amin)/(c.amax-c.amin):0;
  else if(unit==='V') p=(c.vmax-c.vmin)!==0?(x-c.vmin)/(c.vmax-c.vmin):0;
  var tr=Math.round(c.t.min+c.t.div*p), txs='--', txraw='';
  if(isFinite(tr)){
    if(!c.t.hex){ if(tr>=1000) tr=999; if(tr<0) tr=0; txs=String(tr); txraw=txs; }
    else { if(tr<0) tr=0; txraw=tr.toString(16).toUpperCase(); txs=txraw+'  ('+tr+')'; }
  }
  var ind=c.smin+(c.smax-c.smin)*p, ma=c.amin+(c.amax-c.amin)*p, v=c.vmin+(c.vmax-c.vmin)*p;
  var res={rows:[
    {l:'伝送値 '+c.t.short,v:txs,u:'TX',raw:txraw,hex:c.t.hex},
    {l:'指示値 (目盛)',v:fx(ind,2),u:'IND',raw:ind},
    {l:'割合',v:fx(p*100,2)+' %',u:'PCT',raw:p*100},
    {l:'電流',v:fx(ma,3)+' mA',u:'MA',raw:ma},
    {l:'電圧 '+(S.set.vmode==='15'?'(1-5V)':'('+c.r+'Ω)'),v:fx(v,3)+' V',u:'V',raw:v}
  ],note:c.t.name+' ・ 目盛 '+fx(c.smin,2)+'〜'+fx(c.smax,2)+' ・ '+fx(c.amin,0)+'〜'+fx(c.amax,0)+' mA ・ '+(S.set.vmode==='15'?'1-5V (250Ω)':c.r+'Ω')};
  if(isFinite(p)&&(p<-0.0001||p>1.0001)) res.warn='範囲外の値です (割合 '+fx(p*100,1)+' %)';
  return res;
}

var TLIST=['vswr','wave','coax','link','power','vdrop','batt','ohm','area','mass','resist','cap','ipv4','sw'];

function tv(id){ if(!S.tv[id]) S.tv[id]={}; var v=S.tv[id]; TOOLS[id].fields.forEach(function(f){ if(v[f.k]===undefined) v[f.k]=f.def; }); return v; }
function visFields(id){ var v=tv(id); return TOOLS[id].fields.filter(function(f){return !f.show||f.show(v);}); }
function optsOf(f,v){ return typeof f.opts==='function'?f.opts(v):f.opts; }
function curField(){ var fs=visFields(S.tool); if(S.field>=fs.length) S.field=fs.length-1; if(S.field<0) S.field=0; return fs[S.field]; }
function setV(f,val){ var v=tv(S.tool); v[f.k]=val; if(TOOLS[S.tool].change) TOOLS[S.tool].change(v,f.k); }
function openTool(id,prefill){
  if(id==='sw'){ openSw(); return; }
  S.prev=S.mode==='list'?S.prev:S.mode; S.mode='tool'; S.tool=id; S.field=0; S.fresh=true; tv(id);
  if(prefill){ var x=entryVal(); if(isFinite(x)&&S.entry.length){ S.tv[id][TOOLS[id].fields[0].k]=rawNum(x); S.field=1; } }
}

/* ================= 入力ロジック ================= */
function entryStr(){return S.entry.join('');}
function entryVal(){
  var s=entryStr();
  if(S.mode==='conv'&&S.unit==='TX'&&TXT[S.set.tx].hex){ return /^[0-9A-F]+$/i.test(s)?parseInt(s,16):NaN; }
  if(S.justEval&&S.mode==='calc') return S.ans;
  return evalExpr(s);
}
var OPCONT=['+','−','×','÷','^','²','⁻¹'];
function ins(p){
  if(S.mode==='list'){ if(/^\d$/.test(p)){ var i=(p==='0'?10:+p)-1; if(TLIST[i]) openTool(TLIST[i]); } return; }
  if(S.mode==='tool') return fieldInput(p);
  if(S.mode==='calc'&&S.justEval){
    S.justEval=false;
    S.entry = OPCONT.indexOf(p)>=0 ? pieces(rawNum(S.ans)) : [];
  }
  S.err=''; S.hi=-1;
  if(p==='.'&&!/^[0-9A-F]$/.test(S.entry[S.entry.length-1]||'')) S.entry.push('0');
  S.entry.push(p);
}
function fieldInput(p){
  var f=curField(), v=tv(S.tool);
  if(f.type==='opt'){ if(/^\d$/.test(p)){ var o=optsOf(f,v), i=+p-1; if(i>=0&&i<o.length) setV(f,o[i]); } return; }
  if(f.type==='code'&&!/^\d$/.test(p)) return;
  if(f.type==='ip'&&!/^[\d.]$/.test(p)) return;
  if(/^[A-F]$/.test(p)) return;
  var s=S.fresh?'':String(v[f.k]);
  if(S.fresh&&OPCONT.indexOf(p)>=0) s=String(v[f.k]);
  if(p==='.'&&f.type!=='ip'&&(s===''||!/\d$/.test(s))) s+='0';
  s+=p; if(f.type==='code') s=s.slice(-3);
  setV(f,s); S.fresh=false;
}
function bs(){
  if(S.mode==='tool'){ var f=curField(); if(f.type==='opt') return; var v=tv(S.tool); setV(f,String(v[f.k]).slice(0,-1)); S.fresh=false; return; }
  if(S.mode==='list') return;
  if(S.justEval){ S.justEval=false; S.entry=pieces(S.lastExpr); }
  S.entry.pop(); S.err='';
}
function clr(){
  if(S.mode==='list'){ S.mode=S.prev||'calc'; return; }
  if(S.mode==='tool'){ var f=curField(), v=tv(S.tool); if(f.type!=='opt'&&String(v[f.k])!==''){ setV(f,''); S.fresh=false; } else { S.mode='calc'; S.entry=[]; S.justEval=false; } return; }
  if(S.mode==='conv'){ if(S.entry.length){ S.entry=[]; } else { S.mode='calc'; } return; }
  S.entry=[]; S.justEval=false; S.lastExpr=''; S.err=''; S.hi=-1;
}
function allClear(){ S.mode='calc'; S.entry=[]; S.justEval=false; S.lastExpr=''; S.err=''; S.hi=-1; }
function plusMinus(){
  if(S.mode==='tool'){ var f=curField(); if(f.type&&f.type!=='num') return; var v=tv(S.tool), s=String(v[f.k]); setV(f,s.charAt(0)==='-'?s.slice(1):'-'+s); S.fresh=false; return; }
  if(S.mode==='list') return;
  if(S.mode==='calc'&&S.justEval){ S.justEval=false; S.entry=pieces(rawNum(-S.ans)); return; }
  var e=S.entry, n=e.length;
  if(n&&e[n-1]==='ᴇ'){ e.push('-'); return; }
  if(n>1&&e[n-1]==='-'&&e[n-2]==='ᴇ'){ e.pop(); return; }
  var i=n; while(i>0&&/^[0-9.A-Fᴇ]$/.test(e[i-1])) i--;
  if(i>0&&e[i-1]==='-'&&e[i-2]==='ᴇ'){ i-=2; while(i>0&&/^[0-9.A-F]$/.test(e[i-1])) i--; }
  if(i>0&&e[i-1]==='-') e.splice(i-1,1); else e.splice(i,0,'-');
}
function equals(){
  if(S.mode==='list'){ openTool(TLIST[S.sel]); return; }
  if(S.mode==='tool'){ var n=visFields(S.tool).length; S.field=(S.field+1)%n; S.fresh=true; return; }
  if(S.mode==='conv'){ var x=entryVal(); if(isFinite(x)) pushHist(entryStr()+' '+UNAME[S.unit],x,S.entry.slice()); return; }
  if(S.justEval||!S.entry.length) return;
  var v=evalExpr(entryStr());
  S.lastExpr=entryStr();
  if(!isFinite(v)){ S.err=isNaN(v)?'Syntax ERROR':'Math ERROR'; return; }
  S.ans=v; S.justEval=true; S.err='';
  pushHist(S.lastExpr,v,S.entry.slice());
}
function pushHist(expr,v,p){ S.hist.unshift({e:expr,v:v,p:p}); if(S.hist.length>30) S.hist.length=30; S.hi=-1; }
function upDown(d){
  if(S.mode==='tool'){ var n=visFields(S.tool).length, b=document.querySelector('#lcd .lcd-body');
    if(b&&d>0&&S.field===n-1&&b.scrollTop+b.clientHeight<b.scrollHeight-2){ b.scrollTop+=b.clientHeight*0.7; S.noScroll=true; return; }
    if(b&&d<0&&S.field===0&&b.scrollTop>0){ b.scrollTop=0; S.noScroll=true; return; }
    S.field=(S.field+d+n)%n; S.fresh=true; return; }
  if(S.mode==='list'){ S.sel=(S.sel+d+TLIST.length)%TLIST.length; return; }
  if(S.mode==='conv'){ var g=RF.indexOf(S.unit)>=0?RF:TX, i=g.indexOf(S.unit); S.unit=g[(i+d+g.length)%g.length]; return; }
  if(!S.hist.length) return;
  var hi=S.hi+(d<0?1:-1); if(hi<0){ S.hi=-1; S.entry=[]; S.justEval=false; return; }
  if(hi>=S.hist.length) hi=S.hist.length-1;
  S.hi=hi; var h=S.hist[hi]; S.entry=(h.p||[]).slice(); S.justEval=false; S.err='';
}
function leftRight(d){
  if(S.mode==='tool'){
    var f=curField(), v=tv(S.tool);
    if(f.type==='opt'){ var o=optsOf(f,v), i=o.indexOf(v[f.k]); setV(f,o[(i+d+o.length)%o.length]); return; }
    if(f.presets){ var ps=f.presets, cur=N(v,f.k), j=-1; for(var k=0;k<ps.length;k++){ if(Math.abs(+ps[k]-cur)<1e-9){j=k;break;} }
      j = j<0 ? 0 : (j+d+ps.length)%ps.length; setV(f,ps[j]); S.fresh=true; }
    return;
  }
  if(S.mode==='conv'){ if(RF.indexOf(S.unit)>=0) toggleImp(); else cycleTx(d); }
}
function toggleImp(){ S.set.imp=S.set.imp===50?75:50; }
function cycleTx(d){ var i=TXORDER.indexOf(S.set.tx); S.set.tx=TXORDER[(i+d+3)%3]; }
function toConv(u){
  if(S.mode==='tool'||S.mode==='list') S.mode='calc';
  if(S.mode==='calc'){
    if(S.justEval){ S.entry=pieces(rawNum(S.ans)); S.justEval=false; }
    else if(S.entry.length&&!(u==='TX'&&TXT[S.set.tx].hex)){ var x=evalExpr(entryStr()); if(isFinite(x)&&/[+−×÷^²√(]|log|ln|⁻¹/.test(entryStr())) S.entry=pieces(rawNum(x)); }
  }
  S.mode='conv'; S.unit=u; S.err='';
}
function rebase(u,raw,hex){
  if(raw===''||raw===undefined||(typeof raw==='number'&&!isFinite(raw))) return;
  S.unit=u; S.entry=pieces(hex?String(raw):rawNum(Number(raw)));
}

function press(k){
  var sh=S.shift; if(k!=='shift') S.shift=false;
  buzz();
  if(S.mode==='sw'&&swKey(k,sh)){ render(); save(); return; }
  switch(k){
    case 'shift': S.shift=!sh; break;
    case 'tool': if(sh){ openSw(); break; } if(S.mode==='list'){ S.mode=S.prev||'calc'; } else { S.prev=S.mode; S.mode='list'; } break;
    case 'set': openBack(); return;
    case 'clr': if(sh) allClear(); else clr(); break;
    case 'bs': bs(); break;
    case 'pm': plusMinus(); break;
    case 'up': upDown(-1); break;
    case 'down': upDown(1); break;
    case 'left': leftRight(-1); break;
    case 'right': leftRight(1); break;
    case 'dBm': if(sh){ toggleImp(); break; } toConv('dBm'); break;
    case 'TX': if(sh){ cycleTx(1); break; } toConv('TX'); break;
    case 'dBuV': case 'W': case 'mW': case 'IND': case 'PCT': case 'MA': case 'V': toConv(k); break;
    case 'vswr': openTool(sh?'wave':'vswr',!sh); break;
    case 'sq': ins(sh?'^':'²'); if(sh) ins('('); break;
    case 'sqrt': ins(sh?'∛(':'√('); break;
    case 'log': ins(sh?'ln(':'log('); break;
    case 'pow10': if(sh){ ins('ℯ'); ins('^'); ins('('); } else { ins('1'); ins('0'); ins('^'); ins('('); } break;
    case 'inv': ins(sh?'π':'⁻¹'); break;
    case 'exp': ins('ᴇ'); break;
    case 'ans': ins('Ans'); break;
    case '=': equals(); break;
    default:
      if(/^\d$/.test(k)){ if(sh&&/[1-6]/.test(k)) ins('ABCDEF'[+k-1]); else ins(k); }
      else ins(k);
  }
  render(); save();
}

/* ================= ストップウォッチ ================= */
function swEl(){ var w=S.sw; return w.acc+(w.run?Math.max(0,Date.now()-w.start):0); }
function fmtT(ms){ var cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000)%60, h=Math.floor(ms/3600000);
  var p2=function(n){return (n<10?'0':'')+n;}; return (h?h+':'+p2(m):p2(m))+':'+p2(s)+'.'+p2(cs); }
var wake=null;
function wakeOn(){ try{ if(navigator.wakeLock&&!wake) navigator.wakeLock.request('screen').then(function(l){wake=l; l.addEventListener('release',function(){wake=null;});}).catch(function(){}); }catch(e){} }
function wakeOff(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }
function openSw(){ if(S.mode!=='sw'&&S.mode!=='list') S.prev=S.mode; S.mode='sw'; if(S.sw.run) wakeOn(); }
function swToggle(){ var w=S.sw; if(w.run){ w.acc+=Date.now()-w.start; w.run=false; S.ans=w.acc/1000; wakeOff(); } else { w.start=Date.now(); w.run=true; wakeOn(); } }
function swLapReset(){ var w=S.sw; if(w.run){ var t=swEl(); w.laps.unshift(t); if(w.laps.length>99) w.laps.length=99; } else { w.acc=0; w.laps=[]; } }
function swKey(k,sh){
  if(k==='='){ swToggle(); return true; }
  if(k==='+'){ swLapReset(); return true; }
  if(k==='clr'&&!sh){ if(S.sw.run) return true; if(swEl()>0||S.sw.laps.length){ swLapReset(); } else { S.mode='calc'; } return true; }
  if(/^\d$/.test(k)||['.','−','×','÷','(',')','bs','pm','up','down','left','right','exp','ans','sq','sqrt','log','pow10','inv'].indexOf(k)>=0) return true;
  return false;
}
setInterval(function(){ if(S.mode==='sw'&&S.sw.run){ var el=$('swTime'); if(el) el.textContent=fmtT(swEl()); } },47);

/* ================= 描画 ================= */
function render(){
  // status
  var t=TXT[S.set.tx], sc=S.set.scale[S.set.tx];
  $('status').innerHTML='<button type="button" data-go="imp">'+S.set.imp+'Ω</button><button type="button" data-go="tx">'+esc(t.short)+'</button><button type="button" data-go="v">'+(S.set.vmode==='15'?'1-5V':S.set.r+'Ω')+'</button><button type="button" data-go="sc">目盛 '+fx(+sc[0],1)+'〜'+fx(+sc[1],1)+'</button>';
  document.querySelectorAll('.k.sh').forEach(function(b){ b.classList.toggle('on',S.shift); });
  var L=$('lcd'), top='<div class="lcd-top"><span class="ind'+(S.shift?' on':'')+'">S</span>'+(S.sw.run&&S.mode!=='sw'?'<span class="ind on">⏱</span>':'');
  var body='';
  if(S.mode==='calc'){
    top+='<span>COMP</span>'+(S.hi>=0?'<span>履歴 '+(S.hi+1)+'/'+S.hist.length+'</span>':'')+'<span class="grow"></span>';
    var shown=S.justEval?S.lastExpr:entryStr();
    body+='<div class="entry">'+esc(shown||'')+(S.justEval?'':'<span class="cursor"></span>')+'</div>';
    if(S.err) body+='<div class="result">'+S.err+'</div>';
    else if(S.justEval) body+='<div class="result">'+esc(fmtNum(S.ans))+'</div>';
    else if(S.entry.length){ var pv=evalExpr(entryStr()); body+='<div class="result preview">'+(isFinite(pv)?esc(fmtNum(pv)):(/[A-F]/.test(entryStr())?'16進数 → 伝送値キー':''))+'</div>'; }
    else body+='<div class="hint">数値を入れて <b>単位キー</b> (dBm・W・伝送値 など) を押すと、関連する値をまとめて換算します。<br><b>TOOL</b> で電圧降下・回線設計などの計算、<b>⚙設定</b> で詳細設定。<br>普通の計算は <b>=</b> で。</div><div class="result">0</div>';
  } else if(S.mode==='conv'){
    var isRF=RF.indexOf(S.unit)>=0;
    top+='<span>'+(isRF?'RF':'伝送')+' 換算</span><span class="grow"></span><span>▲▼単位 ◀▶'+(isRF?'Ω':'種別')+'</span>';
    var x=entryVal(), res=isFinite(x)?(isRF?rfCalc(S.unit,x):txCalc(S.unit,x)):null;
    body+='<div class="convin"><div class="entry">'+esc(entryStr())+'<span class="cursor"></span></div><span class="u">'+esc(UNAME[S.unit])+(S.unit==='TX'?' '+esc(TXT[S.set.tx].short):'')+'</span></div>';
    var rows=res?res.rows:(isRF?rfCalc('dBm',NaN):txCalc('PCT',NaN)).rows.map(function(r){return {l:r.l,v:'--',u:r.u};});
    body+='<div class="rows">'+rows.map(function(r,i){ return '<div class="row'+(r.u===S.unit?' me':'')+(r.u?'':' static')+'" data-row="'+i+'"><span class="l">'+esc(r.l)+'</span><span class="v">'+esc(r.v)+'</span></div>'; }).join('')+'</div>';
    if(res&&res.warn) body+='<div class="warn">'+esc(res.warn)+'</div>';
    body+='<div class="note">'+esc((res||(isRF?rfCalc('dBm',0):txCalc('PCT',0))).note)+' ・ 行をタップで入力単位を切替</div>';
    L._rows=res?res.rows:null;
  } else if(S.mode==='list'){
    top+='<span>TOOL 一覧</span><span class="grow"></span><button class="lcd-x" type="button" data-x="1">✕ 閉じる</button>';
    body+='<div class="rows list">'+TLIST.map(function(id,i){ return '<div class="row'+(i===S.sel?' me':'')+'" data-tool="'+id+'"><span class="l">'+(i<10?((i+1)%10)+'. ':'　 ')+esc(id==='sw'?'ストップウォッチ':TOOLS[id].name)+'</span><span class="v">'+(id==='sw'?'計時':TOOLS[id].fields.length+' 項目')+'</span></div>'; }).join('')+'</div>';
    body+='<div class="note">数字キー・タップ・▲▼＋= で選択</div>';
  } else if(S.mode==='sw'){
    var w=S.sw, el=swEl();
    top+='<span>ストップウォッチ</span><span class="grow"></span><button class="lcd-x" type="button" data-x="1">✕ 閉じる</button>';
    body+='<div class="swt" id="swTime">'+fmtT(el)+'</div>';
    body+='<div class="swst">'+(w.run?'計測中':(el>0?'停止中':'待機中'))+'</div>';
    body+='<div class="swb"><button type="button" data-sw="go" class="'+(w.run?'stop':'go')+'">'+(w.run?'ストップ':(el>0?'再開':'スタート'))+'</button><button type="button" data-sw="lap">'+(w.run?'ラップ':'リセット')+'</button></div>';
    if(w.laps.length){
      body+='<div class="rows">'+w.laps.map(function(t,i){ var prev=w.laps[i+1]||0; return '<div class="row static"><span class="l">ラップ '+(w.laps.length-i)+'　'+fmtT(t-prev)+'</span><span class="v">'+fmtT(t)+'</span></div>'; }).join('')+'</div>';
    }
    body+='<div class="note">= キーでスタート/ストップ ・ + キーでラップ ・ CLR でリセット<br>アプリを閉じても計測は続きます。停止すると秒数 ('+fx(el/1000,2)+' 秒) が Ans に入ります。</div>';
  } else if(S.mode==='tool'){
    var T=TOOLS[S.tool], v=tv(S.tool), fs=visFields(S.tool); curField();
    top+='<span>TOOL</span><span class="grow"></span><button class="lcd-x" type="button" data-x="1">✕ 終了</button>';
    body+='<div class="ttl">'+esc(T.name)+'</div>';
    body+=fs.map(function(f,i){
      var val=v[f.k], disp;
      if(f.type==='opt'){ disp='<span class="opt">'+(f.col?'<span class="sw" style="background:'+COL[val].h+'"></span>':'')+esc(f.fmt?f.fmt(val):val)+'</span>'; }
      else disp=esc(val===''?'—':String(val).replace(/(^|[^\d])\.(?=\d)/g,'$10.'))+(i===S.field&&!S.fresh?'<span class="cursor"></span>':'')+(f.unit?' '+esc(f.unit):'');
      return '<div class="fld'+(i===S.field?' act':'')+'" data-f="'+i+'"><span class="l">'+esc(f.label)+'</span><span class="v">'+disp+'</span></div>';
    }).join('');
    var r=T.calc(v)||{};
    body+='<div class="sep"></div>';
    if(r.warn) body+='<div class="warn">'+esc(r.warn)+'</div>';
    if(r.rows) body+='<div class="rows">'+r.rows.map(function(x){ return '<div class="row static'+(x.strong?' strong':'')+'"><span class="l">'+esc(x.l)+'</span><span class="v">'+esc(x.v)+'</span></div>'; }).join('')+'</div>';
    if(r.note) body+='<div class="note">'+esc(r.note)+'</div>';
    body+='<div class="note">▲▼/= 項目移動 ・ ◀▶ 選択肢・プリセット ・ 項目タップで選択</div>';
  }
  top+='</div>';
  var ob=L.querySelector('.lcd-body'), keep=ob?ob.scrollTop:0, vkey=S.mode+'|'+(S.mode==='tool'?S.tool:'');
  if(L._vkey!==vkey) keep=0; L._vkey=vkey;
  L.innerHTML=top+'<div class="lcd-body">'+body+'</div>';
  var nb=L.querySelector('.lcd-body'); if(nb) nb.scrollTop=keep;
  if(!S.noScroll){ var ab=L.querySelector('.fld.act')||L.querySelector('.list .row.me'); if(ab&&ab.scrollIntoView) ab.scrollIntoView({block:'nearest'}); }
  S.noScroll=false;
}

/* ================= 裏画面 (設定) ================= */
function seg(id,opts,cur){ return '<div class="seg" role="group" id="'+id+'">'+opts.map(function(o){ return '<button type="button" data-v="'+esc(o[0])+'" class="'+(String(cur)===String(o[0])?'on':'')+'">'+esc(o[1])+'</button>'; }).join('')+'</div>'; }
function tg(id,on,label){ return '<button type="button" class="tg'+(on?' on':'')+'" id="'+id+'" role="switch" aria-checked="'+(on?'true':'false')+'" aria-label="'+esc(label)+'"></button>'; }
var resetArm=null;
function renderBack(){
  var s=S.set;
  var h='';
  h+='<div class="sec" id="sec-imp"><h3>RF 換算</h3><div class="fr"><span>インピーダンス</span>'+seg('sImp',[[50,'50 Ω'],[75,'75 Ω']],s.imp)+'</div><div class="help">0 dBm = '+off().toFixed(2)+' dBμV ('+s.imp+'Ω系)。dBm・dBμV・W・mW キーと回線設計の dBμV 表示に使います。</div></div>';
  h+='<div class="sec" id="sec-tx"><h3>伝送値</h3><div class="fr"><span>伝送値の種別</span></div>'+seg('sTx',[['dec','200-999'],['hex1','990-FD0'],['hex2','3200-FA00 TM']],s.tx);
  h+='<div class="grid3"><span class="h">種別</span><span class="h">目盛 最小</span><span class="h">目盛 最大</span>';
  TXORDER.forEach(function(k){ h+='<span>'+esc(TXT[k].name)+'</span><input class="num" type="number" step="any" inputmode="decimal" id="sc_'+k+'_0" value="'+esc(s.scale[k][0])+'"><input class="num" type="number" step="any" inputmode="decimal" id="sc_'+k+'_1" value="'+esc(s.scale[k][1])+'">'; });
  h+='</div><div class="fr"><label for="ma0">電流 最小 / 最大 (mA)</label><span><input class="num" type="number" step="any" inputmode="decimal" id="ma0" value="'+esc(s.ma[0])+'"> <input class="num" type="number" step="any" inputmode="decimal" id="ma1" value="'+esc(s.ma[1])+'"></span></div>';
  h+='<div class="fr" id="sec-v"><span>電圧換算</span>'+seg('sVm',[['15','1-5V (250Ω固定)'],['r','受電抵抗を指定']],s.vmode)+'</div>';
  h+='<div class="fr"><label for="rOhm">受電抵抗 (Ω)</label><input class="num" type="number" step="any" inputmode="decimal" id="rOhm" value="'+esc(s.r)+'"'+(s.vmode==='15'?' disabled':'')+'></div>';
  h+='<div class="help">換算は 割合 = (入力 − 最小) ÷ 幅 を共通に使い、伝送値・指示値・電流・電圧へ展開します。HEX 種別では伝送値を16進数で入力 (SHIFT＋1〜6 で A〜F)。</div></div>';
  h+='<div class="sec"><h3>表示・動作</h3><div class="fr"><span>計算結果の小数桁</span>'+seg('sDg',[['auto','自動'],['2','2'],['3','3'],['4','4']],s.digits)+'</div>';
  h+='<div class="fr"><span>キー押下で振動 (対応端末)</span>'+tg('tVib',s.vib,'振動')+'</div>';
  h+='<div class="fr"><span>閉じる直前の画面を起動時に復元</span>'+tg('tRes',s.restore,'復元')+'</div></div>';
  h+='<div class="sec"><h3>使い方</h3><div class="help"><b>換算</b> : 数値 → 単位キー。続けて数字を打つとその場で再計算。▲▼で入力単位、◀▶で Ω / 伝送値種別を切替。結果の行をタップするとその値が入力になります。<br><b>TOOL</b> : VSWR・波長・同軸損失・回線設計・消費電力・電圧降下・バッテリー・オームの法則・面積・質量・カラー抵抗・コンデンサー・IPv4。項目の数値欄では 1.2×3 のような式も使えます。<br><b>ストップウォッチ</b> : SHIFT＋TOOL (または TOOL 一覧の最後)。= でスタート/ストップ、+ でラップ、CLR でリセット。閉じても計測は続きます。<br><b>SHIFT</b> : キー上のオレンジ文字・右下の A〜F を使います。<b>SHIFT＋CLR</b> で全クリア。<br>パソコンではキーボード (数字・+−*/・Enter・Backspace・Esc) も使えます。</div></div>';
  h+='<div class="sec"><h3>リセット</h3><div class="fr"><span>計算履歴 ('+S.hist.length+' 件)</span><button type="button" class="btn ghost" id="bHist">履歴を消去</button></div>';
  h+='<div class="fr"><span>すべての設定とツールの入力値</span><button type="button" class="btn danger" id="bReset">'+(resetArm?'もう一度押すと初期化':'初期値に戻す')+'</button></div></div>';
  h+='<div class="plate">総合換算ツール電卓 V1<br>開発／制作 西菱電機フィールディング(株) 緒方</div>';
  $('bkBody').innerHTML=h;
}
function isBack(){ return !$('back').hidden; }
function turn(toBack){
  var f=$('flipper'), done=false;
  var swap=function(){ if(done) return; done=true; $('back').hidden=!toBack; $('front').hidden=toBack; f.classList.remove('turn-out'); f.classList.add('turn-in'); setTimeout(function(){ f.classList.remove('turn-in'); },260); };
  f.classList.remove('turn-in'); f.classList.add('turn-out');
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) swap(); else setTimeout(swap,200);
}
function openBack(){ renderBack(); turn(true); setTimeout(function(){ try{$('bkClose').focus({preventScroll:true});}catch(e){} },300); save(); }
function closeBack(){ turn(false); resetArm=null; render(); save(); }
function scrollToSec(id){ setTimeout(function(){ var el=$(id); if(el) el.scrollIntoView({block:'start'}); },350); }

/* ================= イベント ================= */
function buzz(){ if(!S.set.vib) return; try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }
function bind(){
  $('keys').addEventListener('click',function(e){ var b=e.target.closest('button[data-k]'); if(!b) return; press(b.getAttribute('data-k')); });
  $('status').addEventListener('click',function(e){
    var b=e.target.closest('button[data-go]'); if(!b) return; var g=b.getAttribute('data-go');
    openBack(); scrollToSec(g==='imp'?'sec-imp':g==='v'?'sec-v':'sec-tx');
  });
  $('lcd').addEventListener('click',function(e){
    var sb=e.target.closest('[data-sw]'); if(sb){ buzz(); if(sb.getAttribute('data-sw')==='go') swToggle(); else swLapReset(); render(); save(); return; }
    var x=e.target.closest('[data-x]'); if(x){ if(S.mode==='list'){ S.mode=(S.prev&&S.prev!=='list')?S.prev:'calc'; if(S.mode==='tool'&&!TOOLS[S.tool]) S.mode='calc'; } else { S.mode='calc'; S.entry=[]; S.justEval=false; } render(); save(); return; }
    var t=e.target.closest('[data-tool]'); if(t){ openTool(t.getAttribute('data-tool')); render(); save(); return; }
    var f=e.target.closest('[data-f]'); if(f){ var i=+f.getAttribute('data-f');
      if(i===S.field){ var cf=curField(); if(cf.type==='opt') leftRight(1); } else { S.field=i; S.fresh=true; }
      render(); save(); return; }
    var r=e.target.closest('[data-row]'); if(r&&S.mode==='conv'&&L_rows()){ var row=L_rows()[+r.getAttribute('data-row')]; if(row&&row.u){ rebase(row.u,row.raw,row.hex); render(); save(); } }
  });
  $('bkClose').addEventListener('click',closeBack);
  $('bkBody').addEventListener('click',function(e){
    var sb=e.target.closest('.seg button');
    if(sb){ var g=sb.parentNode.id, v=sb.getAttribute('data-v');
      if(g==='sImp') S.set.imp=+v; else if(g==='sTx') S.set.tx=v; else if(g==='sVm') S.set.vmode=v; else if(g==='sDg') S.set.digits=v;
      renderBack(); save(); return; }
    if(e.target.id==='tVib'){ S.set.vib=!S.set.vib; renderBack(); save(); return; }
    if(e.target.id==='tRes'){ S.set.restore=!S.set.restore; renderBack(); save(); return; }
    if(e.target.id==='bHist'){ S.hist=[]; S.hi=-1; renderBack(); save(); return; }
    if(e.target.id==='bReset'){
      if(!resetArm){ resetArm=setTimeout(function(){ resetArm=null; if(isBack()) renderBack(); },4000); renderBack(); return; }
      clearTimeout(resetArm); resetArm=null; S.set=clone(DEF_SET); S.tv={}; allClear(); renderBack(); save(); return;
    }
  });
  $('bkBody').addEventListener('input',function(e){
    var el=e.target, id=el.id, val=el.value; if(val==='') return;
    var m=id.match(/^sc_(\w+)_(\d)$/);
    if(m){ S.set.scale[m[1]][+m[2]]=+val; }
    else if(id==='ma0') S.set.ma[0]=+val; else if(id==='ma1') S.set.ma[1]=+val; else if(id==='rOhm') S.set.r=+val;
    save();
  });
  document.addEventListener('keydown',function(e){
    if(isBack()){ if(e.key==='Escape') closeBack(); return; }
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var map={'Enter':'=','=':'=','Backspace':'bs','Escape':'clr','Delete':'clr','+':'+','-':'−','*':'×','/':'÷','(':'(',')':')','.':'.','^':null,'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right'};
    var k=e.key, act=null;
    if(/^\d$/.test(k)) act=k;
    else if(/^[a-fA-F]$/.test(k)&&S.mode!=='tool'){ e.preventDefault(); S.shift=true; press(String('abcdef'.indexOf(k.toLowerCase())+1)); return; }
    else if(map.hasOwnProperty(k)) act=map[k];
    else if(k==='^'){ e.preventDefault(); ins('^'); render(); save(); return; }
    if(!act) return;
    e.preventDefault();
    var btn=document.querySelector('.k[data-k="'+act+'"]'); if(btn){ btn.classList.add('down'); setTimeout(function(){btn.classList.remove('down');},90); }
    press(act);
  });
  document.addEventListener('visibilitychange',save);
  window.addEventListener('pagehide',save);
}
function L_rows(){ return $('lcd')._rows; }

load();
buildKeys();
bind();
$('back').hidden=true;
render();
})();
